[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pondguard"
version = "0.1.0"
description = "An agentic early-warning advisor for shrimp-pond disease (Agentic AI mini-project, BMSCE)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Arya Sharma" },
    { name = "Nazeef Ahsan Rafiqui" },
    { name = "Yasser Ahmed Mohammed" },
    { name = "Ayush Khanuja" },
]

[project.scripts]
pondguard = "pondguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
